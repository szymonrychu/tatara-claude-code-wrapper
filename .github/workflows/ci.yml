name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # Fails FIRST, before any slower job spends compute: a PENDING- pin means
  # tatara-cli (Task 11) or tatara-agent-skills (Task 14) has not published
  # the real tag yet. release.yml cuts the semver git tag BEFORE it builds and
  # pushes the image, so merging with a sentinel still in place would produce
  # a published tag with no image and no chart behind it - a dangling release
  # someone has to clean up by hand.
  #
  # This stays a separate local job (not a ci-shared.yml input) because the
  # reusable workflow's job graph is opaque to the caller: there is no way to
  # inject a `needs: [pin-guard]` into ci-shared's own secscan/lint/test jobs.
  # Gating the whole `ci:` call job below on pin-guard is the equivalent: it
  # already blocks secscan/lint/test (and transitively build/smoke) exactly
  # as the pre-adoption per-job needs did.
  pin-guard:
    runs-on: tatara-claude-code-wrapper
    steps:
      - uses: actions/checkout@v4
      - name: guard against unresolved placeholder pins
        run: |
          if grep -n "PENDING-" Dockerfile Makefile .github/ci/build.sh; then
            echo "unresolved PENDING- placeholder pin(s) found above (TATARA_CLI_VERSION / TATARA_SKILLS_REF) - replace with the real published tag before merging"
            exit 1
          fi

      # tatara-helmfile#397: the skills cd-release bump rewrites the Dockerfile
      # ARG and nothing else, so a second copy anywhere can only drift - and a
      # forwarded --build-arg makes the CD write inert outright, which is what
      # shipped for months. Cheap, offline, and in the repo that owns the value.
      - name: guard TATARA_SKILLS_REF's single build-time source
        run: bash .github/ci/check-skills-pin-single-source.sh

  # Kept OUT of pin-guard so that job stays a pure grep that fails first without
  # installing a toolchain; this one needs helm to render. `ci / chart-validate`
  # is off for this repo and only does `helm lint` + `helm template >/dev/null`
  # anyway, so nothing here ever asserted on what the render actually contains -
  # which is how two successive broken SKILLS_SRC_DIRS values shipped.
  chart-guard:
    needs: [pin-guard]
    runs-on: tatara-claude-code-wrapper
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          cache: true
      - name: guard the chart's skills clone dir
        run: bash .github/ci/check-chart-skills-clone-dir.sh

  ci:
    needs: [pin-guard]
    # CD-MANAGED PIN. tatara-operator's release.yml `fanout-ci-shared` job
    # rewrites this line on every release that changes ci-shared.yml, and its
    # scheduled `ci-shared-currency` check reds when it falls behind
    # (tatara-operator#640). Do not hand-edit it: a hand bump is overwritten by
    # the next release while the real fault stays open.
    uses: szymonrychu/tatara-operator/.github/workflows/ci-shared.yml@v3.10.0
    with:
      runner-label: tatara-claude-code-wrapper
      smoke-binary: ./bin/wrapper
      build-needs-cgo: true
      # enable-image MUST stay false: this repo deliberately dropped its
      # per-push image job (see NOTE below) so it is never double-built. The
      # shared `image` job has no gate to opt out of on push, so leaving this
      # true would silently reintroduce the double-publish this repo already
      # fixed once.
      enable-image: false
      # Dockerfile:57 is `FROM harbor.szymonrichert.pl/containers/tatara-cli:
      # ${TATARA_CLI_VERSION}`. image-verify passes no `--opt target=`, so
      # buildkit solves the whole graph and always reaches it. Measured on this
      # repo's first ever run of that job (PR #186 at v3.10.0): 401
      # Unauthorized on the manifest HEAD, and no project on that Harbor serves
      # anonymous pull.
      #
      # The shared job cannot simply be handed the credential. The only Harbor
      # credentials in that workflow are the PUSH ones, and on pull_request the
      # caller is taken from the PR head - so it would be writing a
      # push-capable credential onto a runner whose job graph a PR can edit.
      # tatara-operator's internal/cicontract/doc.go forbids registry
      # credentials on the PR path outright, and merge_gate_test.go fails on
      # any HARBOR_* env in a non-publishing job.
      #
      # NOT a local decision. The matching entry is
      # cicontract.ImageVerifyExempt in tatara-operator, and the scheduled
      # ci-shared-currency audit reds on any consumer that sets this false
      # without one. Until a pull-only credential or an anonymously pullable
      # base image exists, this repo's Dockerfile is first compiled in
      # release.yml. tatara-operator#640.
      enable-image-verify: false
    secrets: inherit

# NOTE: image + chart publish is NOT here. On a green push-to-main run, the
# `release` workflow (workflow_run gated on this `ci` run) cuts the semver tag,
# then builds+pushes the image and chart at that bare X.Y.Z version. The legacy
# per-push `image`/`chart` jobs (which double-built the image every merge and
# published the 0.0.0-g<sha> chart scheme) are removed in favour of that single
# semver-versioned publish path.
