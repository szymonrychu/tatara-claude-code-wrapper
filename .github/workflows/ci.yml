name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ci:
    uses: szymonrychu/tatara-operator/.github/workflows/ci-shared.yml@v1.35.1
    with:
      runner-label: tatara-claude-code-wrapper
      smoke-binary: ./bin/wrapper
      build-needs-cgo: true
      # enable-image MUST stay false: this repo deliberately dropped its
      # per-push image job (see NOTE below) so it is never double-built. The
      # shared `image` job has no gate to opt out of on push, so leaving this
      # true would silently reintroduce the double-publish this repo already
      # fixed once.
      enable-image: false
    secrets: inherit

# NOTE: image + chart publish is NOT here. On a green push-to-main run, the
# `release` workflow (workflow_run gated on this `ci` run) cuts the semver tag,
# then builds+pushes the image and chart at that bare X.Y.Z version. The legacy
# per-push `image`/`chart` jobs (which double-built the image every merge and
# published the 0.0.0-g<sha> chart scheme) are removed in favour of that single
# semver-versioned publish path.
